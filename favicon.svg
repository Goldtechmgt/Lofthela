<svg xmlns="http://www.w3.org/2000/svg"
     width="512" height="512" viewBox="0 0 512 512">

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101F45"/>
      <stop offset="100%" stop-color="#050B19"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF0A3"/>
      <stop offset="50%" stop-color="#F5C542"/>
      <stop offset="100%" stop-color="#D18B08"/>
    </linearGradient>

    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#39E7FF"/>
      <stop offset="100%" stop-color="#4263FF"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112"
        fill="url(#background)"/>

  <!-- Outer brand border -->
  <rect x="18" y="18" width="476" height="476" rx="100"
        fill="none" stroke="url(#blue)" stroke-width="5"
        opacity="0.8"/>

  <!-- Subtle glow -->
  <circle cx="256" cy="245" r="150"
          fill="#245BFF" opacity="0.10"/>

  <!-- Shopping bag body -->
  <path d="M125 195
           Q125 175 145 175
           H367
           Q387 175 387 195
           L410 389
           Q412 410 390 410
           H122
           Q100 410 102 389 Z"
        fill="url(#gold)"/>

  <!-- Shopping bag handle -->
  <path d="M190 190
           V150
           C190 65 322 65 322 150
           V190"
        fill="none"
        stroke="url(#blue)"
        stroke-width="24"
        stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- Letter L -->
  <path d="M195 220
           H245
           V338
           H330
           V380
           H195 Z"
        fill="#071126"/>

  <!-- Blue accent -->
  <path d="M265 220 H330 V250 H265 Z"
        fill="url(#blue)"/>

  <!-- Sparkle -->
  <path d="M365 105
           L377 135
           L407 147
           L377 159
           L365 189
           L353 159
           L323 147
           L353 135 Z"
        fill="#FFFFFF"/>

  <!-- Small gold accent -->
  <circle cx="130" cy="120" r="9" fill="#F5C542"/>
  <circle cx="385" cy="310" r="7" fill="#39E7FF"/>

</svg>
